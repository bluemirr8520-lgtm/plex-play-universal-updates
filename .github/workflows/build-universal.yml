name: Build Plex Play and Universal

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: LibVLC asset release tag
        required: true
        default: source-v1.0.10

permissions:
  contents: write

concurrency:
  group: plex-play-dual-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNIVERSAL_TAG: v1.0.14
      UNIVERSAL_VERSION: 1.0.14
      UNIVERSAL_VERSION_CODE: "15"
      MAIN_TAG: plex-play-v3.19.27-build
      MAIN_VERSION: 3.19.27
      MAIN_VERSION_CODE: "179"
      EXPECTED_CERT_SHA256: 74c178f3841343954e4a6c74223c4ef06df5cef270485c557d4f915f389845e2
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed release signing key
        env:
          KEYSTORE_B64: ${{ secrets.PLEX_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          key_path="$RUNNER_TEMP/plex-release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          test -s "$key_path"
          mkdir -p "$HOME/.android"
          install -m 600 "$key_path" "$HOME/.android/debug.keystore"
          {
            printf 'PLEX_RELEASE_KEYSTORE=%s\n' "$key_path"
            printf 'PLEX_RELEASE_STORE_PASSWORD=android\n'
            printf 'PLEX_RELEASE_KEY_ALIAS=androiddebugkey\n'
            printf 'PLEX_RELEASE_KEY_PASSWORD=android\n'
          } >> "$GITHUB_ENV"

      - name: Download pinned LibVLC
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          mkdir -p source-assets source/app/libs
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir source-assets --pattern "libvlc-all-3.7.5.aar"
          test -s source-assets/libvlc-all-3.7.5.aar
          cp source-assets/libvlc-all-3.7.5.aar source/app/libs/

      - name: Apply verified subtitle source and Universal version
        run: |
          set -euo pipefail
          python3 source/scripts/apply-vertical-subtitle-patch.py source
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("source/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          for pattern, replacement in (
              (r'(?m)^(\s*versionCode\s*=\s*)\d+', rf'\g<1>{os.environ["UNIVERSAL_VERSION_CODE"]}'),
              (r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', rf'\g<1>"{os.environ["UNIVERSAL_VERSION"]}"'),
          ):
              text, count = re.subn(pattern, replacement, text)
              assert count == 1, f"Expected one version field: {pattern}"
          assert 'applicationId = "io.mirr.plexplay.universal"' in text
          path.write_text(text, encoding="utf-8")
          PY
          test -s source/RELEASE_NOTES_v1.0.14.md

      - name: Reconstruct main app and apply the same subtitle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s source/scripts/prepare-main-overlay.sh
          mkdir -p main-build
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gradle/' \
            --exclude='build/' source/ main-build/
          bash source/scripts/prepare-main-overlay.sh main-build
          cp source/app/build.gradle.kts main-build/app/build.gradle.kts
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("main-build/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (r'(?m)^(\s*applicationId\s*=\s*)"io\.mirr\.plexplay\.universal"', r'\g<1>"io.mirr.plexplay"'),
              (r'(?m)^(\s*versionCode\s*=\s*)\d+', rf'\g<1>{os.environ["MAIN_VERSION_CODE"]}'),
              (r'(?m)^(\s*versionName\s*=\s*)"[^"]+"', rf'\g<1>"{os.environ["MAIN_VERSION"]}"'),
              (r'(?m)^\s*jniLibs\.useLegacyPackaging\s*=\s*true\s*\n', ""),
              (r'(?m)^\s*implementation\(files\("libs/libvlc-all-3\.7\.5\.aar"\)\)\s*\n', ""),
          )
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text)
              assert count == 1, f"Expected one main-app field: {pattern}"
          assert "libvlc" not in text.lower()
          path.write_text(text, encoding="utf-8")
          PY
          rm -rf main-build/app/libs
          python3 source/scripts/apply-vertical-subtitle-patch.py main-build
          test -s main-build/RELEASE_NOTES_v3.19.27.md

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Universal
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace --console=plain

      - name: Test and build main app
        working-directory: main-build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace --console=plain

      - name: Verify both APKs before publishing
        run: |
          set -euo pipefail
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          verify_apk() {
            local project="$1" package="$2" code="$3" version="$4" asset="$5"
            cp "$project/app/build/outputs/apk/release/app-release.apk" "$project/$asset"
            "$tools_dir/apksigner" verify --verbose --print-certs "$project/$asset" \
              > "$project/apk-signature.txt"
            grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" \
              "$project/apk-signature.txt"
            "$tools_dir/zipalign" -c -P 16 -v 4 "$project/$asset" > "$project/apk-alignment.txt"
            "$tools_dir/aapt" dump badging "$project/$asset" > "$project/apk-badging.txt"
            grep -F "package: name='$package' versionCode='$code' versionName='$version'" \
              "$project/apk-badging.txt"
            (cd "$project" && sha256sum "$asset" > "$asset.sha256" && sha256sum -c "$asset.sha256")
          }
          verify_apk source io.mirr.plexplay.universal \
            "$UNIVERSAL_VERSION_CODE" "$UNIVERSAL_VERSION" PlexPlayUniversal.apk
          verify_apk main-build io.mirr.plexplay \
            "$MAIN_VERSION_CODE" "$MAIN_VERSION" PlexPlay.apk

      - name: Upload APKs, verification records, and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlexPlay-v3.19.27-and-Universal-v1.0.14
          if-no-files-found: warn
          path: |
            source/PlexPlayUniversal.apk
            source/PlexPlayUniversal.apk.sha256
            source/apk-*.txt
            source/app/build/test-results/testDebugUnitTest/
            source/app/build/reports/tests/testDebugUnitTest/
            main-build/PlexPlay.apk
            main-build/PlexPlay.apk.sha256
            main-build/apk-*.txt
            main-build/app/build/test-results/testDebugUnitTest/
            main-build/app/build/reports/tests/testDebugUnitTest/

      - name: Commit only verified release source files
        id: release_source
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/build.gradle.kts \
            app/src/main/java/io/mirr/plexplay/ui/PlayerScreen.kt \
            app/src/main/java/io/mirr/plexplay/ui/VlcPlayerScreen.kt \
            app/src/main/java/io/mirr/plexplay/ui/SubtitlePositionSettings.kt \
            app/src/main/java/io/mirr/plexplay/ui/SubtitlePositionPreferences.kt \
            app/src/main/java/io/mirr/plexplay/ui/VerticalSubtitleTypography.kt \
            app/src/test/java/io/mirr/plexplay/ui/VerticalSubtitleBracketTest.kt \
            app/src/test/java/io/mirr/plexplay/ui/VerticalSubtitleTypographyTest.kt \
            USER_GUIDE.md \
            RELEASE_NOTES_v1.0.14.md
          if ! git diff --cached --quiet; then
            git commit -m "Match Plezy vertical subtitle settings in v1.0.14"
            git push origin HEAD:main
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish verified main-app transfer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release_source.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$MAIN_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$MAIN_TAG" main-build/PlexPlay.apk main-build/PlexPlay.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$MAIN_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Plex Play v$MAIN_VERSION verified build" \
              --notes-file main-build/RELEASE_NOTES_v3.19.27.md --draft=false --prerelease --latest=false
          else
            gh release create "$MAIN_TAG" main-build/PlexPlay.apk main-build/PlexPlay.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
              --title "Plex Play v$MAIN_VERSION verified build" \
              --notes-file main-build/RELEASE_NOTES_v3.19.27.md --prerelease --latest=false
          fi

      - name: Publish verified Universal release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release_source.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$UNIVERSAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$UNIVERSAL_TAG" source/PlexPlayUniversal.apk source/PlexPlayUniversal.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$UNIVERSAL_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Plex Play Universal v$UNIVERSAL_VERSION" \
              --notes-file source/RELEASE_NOTES_v1.0.14.md --draft=false --prerelease=false --latest
          else
            gh release create "$UNIVERSAL_TAG" source/PlexPlayUniversal.apk source/PlexPlayUniversal.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
              --title "Plex Play Universal v$UNIVERSAL_VERSION" \
              --notes-file source/RELEASE_NOTES_v1.0.14.md --latest
          fi
