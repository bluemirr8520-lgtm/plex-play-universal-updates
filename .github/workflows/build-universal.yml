name: Build Plex Play Universal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source asset release tag
        required: true
        default: source-v1.0.10

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'source-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINAL_TAG: v1.0.10
      FINAL_VERSION: 1.0.10
      FINAL_VERSION_CODE: "11"
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download source assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event.release.tag_name || inputs.source_tag }}
        run: |
          mkdir -p source-assets source
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir source-assets --pattern "PlexPlayUniversal-source.zip" --pattern "libvlc-all-3.7.5.aar"
          unzip -q source-assets/PlexPlayUniversal-source.zip -d source
          mkdir -p source/app/libs
          cp source-assets/libvlc-all-3.7.5.aar source/app/libs/libvlc-all-3.7.5.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace --console=plain

      - name: Verify APK and checksum
        working-directory: source
        run: |
          cp app/build/outputs/apk/release/app-release.apk PlexPlayUniversal.apk
          sha256sum PlexPlayUniversal.apk | awk '{print $1 "  PlexPlayUniversal.apk"}' > PlexPlayUniversal.apk.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs PlexPlayUniversal.apk
          "$AAPT" dump badging PlexPlayUniversal.apk | tee apk-badging.txt
          grep -F "package: name='io.mirr.plexplay.universal' versionCode='${FINAL_VERSION_CODE}' versionName='${FINAL_VERSION}'" apk-badging.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexPlayUniversal-v1.0.10
          path: |
            source/PlexPlayUniversal.apk
            source/PlexPlayUniversal.apk.sha256
            source/app/build/test-results/testDebugUnitTest/

      - name: Publish verified release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$FINAL_TAG" PlexPlayUniversal.apk PlexPlayUniversal.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" --title "Plex Play Universal v${FINAL_VERSION}" --notes-file RELEASE_NOTES_v1.0.10.md --latest
          else
            gh release create "$FINAL_TAG" PlexPlayUniversal.apk PlexPlayUniversal.apk.sha256 --repo "$GITHUB_REPOSITORY" --title "Plex Play Universal v${FINAL_VERSION}" --notes-file RELEASE_NOTES_v1.0.10.md --latest
          fi
