name: Build Plex Play Universal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_tag:
        description: LibVLC asset release tag
        required: true
        default: source-v1.0.10

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'source-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINAL_TAG: v1.0.12
      FINAL_VERSION: 1.0.12
      FINAL_VERSION_CODE: "13"
      EXPECTED_CERT_SHA256: 74c178f3841343954e4a6c74223c4ef06df5cef270485c557d4f915f389845e2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Restore fixed release signing key
        env:
          KEYSTORE_B64: ${{ secrets.PLEX_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/plex-release.keystore"
          {
            echo "PLEX_RELEASE_KEYSTORE=$RUNNER_TEMP/plex-release.keystore"
            echo "PLEX_RELEASE_STORE_PASSWORD=android"
            echo "PLEX_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "PLEX_RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download pinned LibVLC
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event.release.tag_name || inputs.source_tag }}
        run: |
          mkdir -p source-assets source/app/libs
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir source-assets --pattern "libvlc-all-3.7.5.aar"
          cp source-assets/libvlc-all-3.7.5.aar source/app/libs/libvlc-all-3.7.5.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace --console=plain

      - name: Verify APK, certificate and checksum
        working-directory: source
        run: |
          cp app/build/outputs/apk/release/app-release.apk PlexPlayUniversal.apk
          sha256sum PlexPlayUniversal.apk | awk '{print $1 "  PlexPlayUniversal.apk"}' > PlexPlayUniversal.apk.sha256
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs PlexPlayUniversal.apk)"
          echo "$CERT_OUTPUT"
          echo "$CERT_OUTPUT" | grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256"
          "$AAPT" dump badging PlexPlayUniversal.apk | tee apk-badging.txt
          grep -F "package: name='io.mirr.plexplay.universal' versionCode='${FINAL_VERSION_CODE}' versionName='${FINAL_VERSION}'" apk-badging.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexPlayUniversal-v1.0.12
          path: |
            source/PlexPlayUniversal.apk
            source/PlexPlayUniversal.apk.sha256
            source/app/build/test-results/testDebugUnitTest/

      - name: Publish verified release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$FINAL_TAG" PlexPlayUniversal.apk PlexPlayUniversal.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" --title "Plex Play Universal v${FINAL_VERSION}" --notes-file RELEASE_NOTES_v1.0.12.md --latest
          else
            gh release create "$FINAL_TAG" PlexPlayUniversal.apk PlexPlayUniversal.apk.sha256 --repo "$GITHUB_REPOSITORY" --title "Plex Play Universal v${FINAL_VERSION}" --notes-file RELEASE_NOTES_v1.0.12.md --latest
          fi
