name: Build and release Plex Play Universal

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: LibVLC asset release tag
        required: true
        default: source-v1.0.10

permissions:
  contents: write

concurrency:
  group: plex-play-universal-v1.0.15-release
  cancel-in-progress: false

env:
  UNIVERSAL_TAG: v1.0.15
  UNIVERSAL_VERSION: 1.0.15
  UNIVERSAL_VERSION_CODE: "16"
  EXPECTED_CERT_SHA256: 74c178f3841343954e4a6c74223c4ef06df5cef270485c557d4f915f389845e2
  EXPECTED_LIBVLC_SHA256: 2c25507adb1260aa4d81aad8c2ce98765d98026b9381f49ea454d0b8092f21cb

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Require the current main HEAD
        id: source_head
        run: |
          set -euo pipefail
          git -C source fetch --no-tags origin main
          checkout_commit="$(git -C source rev-parse HEAD)"
          remote_commit="$(git -C source rev-parse origin/main)"
          test "$checkout_commit" = "$remote_commit"
          printf 'commit=%s\n' "$checkout_commit" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$UNIVERSAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $UNIVERSAL_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          if git -C source ls-remote --exit-code --tags origin \
            "refs/tags/$UNIVERSAL_TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $UNIVERSAL_TAG already exists; refusing to reuse it."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed release signing key
        env:
          KEYSTORE_B64: ${{ secrets.PLEX_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          key_path="$RUNNER_TEMP/plex-release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          test -s "$key_path"
          mkdir -p "$HOME/.android"
          install -m 600 "$key_path" "$HOME/.android/debug.keystore"
          {
            printf 'PLEX_RELEASE_KEYSTORE=%s\n' "$key_path"
            printf 'PLEX_RELEASE_STORE_PASSWORD=android\n'
            printf 'PLEX_RELEASE_KEY_ALIAS=androiddebugkey\n'
            printf 'PLEX_RELEASE_KEY_PASSWORD=android\n'
          } >> "$GITHUB_ENV"

      - name: Download pinned LibVLC
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/libvlc"
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir" source/app/libs
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$asset_dir" --pattern "libvlc-all-3.7.5.aar"
          test -s "$asset_dir/libvlc-all-3.7.5.aar"
          test "$(sha256sum "$asset_dir/libvlc-all-3.7.5.aar" | awk '{print $1}')" = \
            "$EXPECTED_LIBVLC_SHA256"
          cp "$asset_dir/libvlc-all-3.7.5.aar" source/app/libs/

      - name: Apply and verify the deterministic Universal snapshot
        run: |
          set -euo pipefail
          python3 source/scripts/apply-universal-release.py source
          python3 source/scripts/apply-universal-release.py source --check
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path("source/app/build.gradle.kts").read_text(encoding="utf-8")
          assert re.search(r'(?m)^\s*applicationId\s*=\s*"io\.mirr\.plexplay\.universal"\s*$', build)
          assert re.search(r'(?m)^\s*versionCode\s*=\s*16\s*$', build)
          assert re.search(r'(?m)^\s*versionName\s*=\s*"1\.0\.15"\s*$', build)
          for required in (
              "source/README.md",
              "source/USER_GUIDE.md",
              "source/RELEASE_NOTES_v1.0.15.md",
          ):
              path = Path(required)
              assert path.is_file() and path.stat().st_size > 0, required
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run 86 tests and build the signed release
        working-directory: source
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace --console=plain

      - name: Verify all 86 tests passed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_dir = Path("source/app/build/test-results/testDebugUnitTest")
          reports = sorted(report_dir.glob("TEST-*.xml"))
          assert reports, f"No test reports found in {report_dir}"
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, "0"))
          assert totals == {"tests": 86, "failures": 0, "errors": 0, "skipped": 0}, totals
          print("Verified 86 passing tests")
          PY

      - name: Stage and verify the Universal APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp source/app/build/outputs/apk/release/app-release.apk dist/PlexPlayUniversal.apk
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          "$tools_dir/apksigner" verify --verbose --print-certs dist/PlexPlayUniversal.apk \
            > dist/apk-signature.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" \
            dist/apk-signature.txt
          "$tools_dir/zipalign" -c -P 16 -v 4 dist/PlexPlayUniversal.apk \
            > dist/apk-alignment.txt
          "$tools_dir/aapt" dump badging dist/PlexPlayUniversal.apk > dist/apk-badging.txt
          grep -F "package: name='io.mirr.plexplay.universal' versionCode='$UNIVERSAL_VERSION_CODE' versionName='$UNIVERSAL_VERSION'" \
            dist/apk-badging.txt
          test "$(wc -c < dist/PlexPlayUniversal.apk)" -gt 20000000
          (
            cd dist
            sha256sum PlexPlayUniversal.apk > PlexPlayUniversal.apk.sha256
            sha256sum -c PlexPlayUniversal.apk.sha256
          )

      - name: Upload verified build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlexPlayUniversal-v1.0.15-verified
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/PlexPlayUniversal.apk
            dist/PlexPlayUniversal.apk.sha256
            dist/apk-*.txt
            source/README.md
            source/USER_GUIDE.md
            source/RELEASE_NOTES_v1.0.15.md
            source/app/build/test-results/testDebugUnitTest/
            source/app/build/reports/tests/testDebugUnitTest/

      - name: Commit only the verified Universal release source
        id: release_source
        working-directory: source
        env:
          BASE_COMMIT: ${{ steps.source_head.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/apply-universal-release.py . --check
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"

          python3 - <<'PY'
          import subprocess

          allowed_files = {
              "README.md",
              "USER_GUIDE.md",
              "RELEASE_NOTES_v1.0.15.md",
              "app/build.gradle.kts",
          }
          allowed_prefixes = (
              "app/src/main/java/",
              "app/src/test/",
          )
          ignored_untracked = {"app/libs/libvlc-all-3.7.5.aar"}

          def nul_paths(*command: str) -> set[str]:
              output = subprocess.check_output(command)
              return {item.decode("utf-8") for item in output.split(b"\0") if item}

          changed = nul_paths("git", "diff", "--name-only", "-z", "HEAD")
          untracked = nul_paths("git", "ls-files", "--others", "--exclude-standard", "-z")
          unexpected = sorted(
              path
              for path in changed | (untracked - ignored_untracked)
              if path not in allowed_files and not path.startswith(allowed_prefixes)
          )
          if unexpected:
              raise SystemExit(f"Unexpected release-source changes: {unexpected}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            USER_GUIDE.md \
            RELEASE_NOTES_v1.0.15.md \
            app/build.gradle.kts \
            app/src/main/java \
            app/src/test
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::The v1.0.15 snapshot produced no source changes."
            exit 1
          fi
          git commit -m "Release Plex Play Universal v1.0.15"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          git push origin HEAD:main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the new verified Universal release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release_source.outputs.commit }}
        run: |
          set -euo pipefail
          git -C source fetch --no-tags origin main
          test "$(git -C source rev-parse origin/main)" = "$RELEASE_COMMIT"
          if gh release view "$UNIVERSAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $UNIVERSAL_TAG appeared during the build; refusing to overwrite it."
            exit 1
          fi
          if git -C source ls-remote --exit-code --tags origin \
            "refs/tags/$UNIVERSAL_TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $UNIVERSAL_TAG appeared during the build; refusing to reuse it."
            exit 1
          fi
          git -C source tag -a "$UNIVERSAL_TAG" \
            -m "Plex Play Universal $UNIVERSAL_VERSION" "$RELEASE_COMMIT"
          git -C source push origin "refs/tags/$UNIVERSAL_TAG"
          gh release create "$UNIVERSAL_TAG" \
            dist/PlexPlayUniversal.apk \
            dist/PlexPlayUniversal.apk.sha256 \
            source/USER_GUIDE.md \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Plex Play Universal v$UNIVERSAL_VERSION" \
            --notes-file source/RELEASE_NOTES_v1.0.15.md \
            --latest

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$UNIVERSAL_TAG"
          test "$(gh release view "$UNIVERSAL_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)" = \
            "$(printf '%s\n' PlexPlayUniversal.apk PlexPlayUniversal.apk.sha256 USER_GUIDE.md | sort)"

          verification_dir="$(mktemp -d "$RUNNER_TEMP/release-verify.XXXXXX")"
          gh release download "$UNIVERSAL_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$verification_dir" \
            --pattern "PlexPlayUniversal.apk" \
            --pattern "PlexPlayUniversal.apk.sha256"
          (
            cd "$verification_dir"
            sha256sum -c PlexPlayUniversal.apk.sha256
          )
          test "$(sha256sum "$verification_dir/PlexPlayUniversal.apk" | awk '{print $1}')" = \
            "$(sha256sum dist/PlexPlayUniversal.apk | awk '{print $1}')"
